name: Compile and Publish Automatic Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download the source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # =========================================================================
      # Inject the Tag version into the source code.
      # =========================================================================
      - name: Inject current tag version into Python code
        shell: python
        run: |
          import re

          file_path = "WingetUpdater.py"
          tag_version = "${{ github.ref_name }}"

          # Read the original content
          with open(file_path, "r", encoding="utf-8") as f:
              content = f.read()
              
          # Replace the VERSION_ACTUAL constant with the one from the GitHub tag.
          new_content = re.sub(r'VERSION_ACTUAL\s*=\s*["\'][^"\']+["\']', f'VERSION_ACTUAL = "{tag_version}"', content)

          # Save the changes to the file
          with open(file_path, "w", encoding="utf-8") as f:
              f.write(new_content)
              
          print(f"--- [SUCCESS] Version {tag_version} successfully injected into the source code ---")

      - name: Run compilation and publishing script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python github_build.py
