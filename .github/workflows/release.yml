name: Compile and Publish Automatic Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download the source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # =========================================================================
      # Inject the Tag version into the source code.
      # =========================================================================
      - name: Inject current tag version into Python code
        shell: powershell
        run: |
          python -c "import re; f = open('WingetUpdater.py', 'r', encoding='utf-8'); c = f.read(); f.close(); c = re.sub(r'VERSION_ACTUAL\s*=\s*[\"\'\'][^\"\'\']+[\"\'\']', 'VERSION_ACTUAL = \"${{ github.ref_name }}\"', c); f = open('WingetUpdater.py', 'w', encoding='utf-8'); f.write(c); f.close()"

      - name: Run compilation and publishing script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python github_build.py
