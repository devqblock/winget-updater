name: Compile and Publish Automatic Release

on:
  push:
    tags:
      - 'v*' # It is triggered when uploading tags such as v1.0.7, v1.1, etc.

permissions:
  contents: write # Required permission to create the release and upload files.

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download source code
      uses: actions/checkout@v4

    - name: Configure Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile executable with PyInstaller
      run: |
        pyinstaller --clean --noconfirm --onefile --windowed --name WingetUpdater-\${{ github.ref_name }} --icon icono.ico --add-data "icono.ico;." --manifest admin.manifest WingetUpdater.py

    - name: Generate SHA256 Hash (Secure Python)
      id: crypto
      env:
        TAG_VERSION: \${{ github.ref_name }}
      run: |
        python -c "import hashlib, os; version = os.environ['TAG_VERSION']; exe_name = f'WingetUpdater-{version}.exe'; h = hashlib.sha256(open(f'dist/{exe_name}','rb').read()).hexdigest(); open('dist/checksums.txt','w').write(f'{h}  {exe_name}\n'); f = open(os.environ['GITHUB_OUTPUT'], 'a'); f.write(f'sha_hash={h}\n'); f.close()"

    - name: Create Release and upload files
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/WingetUpdater-\${{ github.ref_name }}.exe
          dist/checksums.txt
        name: WingetUpdater ${{ github.ref_name }}
        body: |
          ## 🚀 WingetUpdater ${{ github.ref_name }}
          New version automatically published!
          
          ### 🔒 Integrity Verification (SHA256)
          The official SHA256 hash for this version is:
          ```text
          ${{ steps.crypto.outputs.sha_hash }}
          ```
          
          Open a terminal in your downloads folder and run the corresponding command to verify that the file is authentic:
          
          #### 💻 PowerShell
          ```powershell
          Get-FileHash .\WingetUpdater-${{ github.ref_name }}.exe -Algorithm SHA256
          ```
          _(Compare that the result matches exactly with the official hash above)._
          
          #### 📟 Command Prompt (CMD)
          ```cmd
          certutil -hashfile WingetUpdater-${{ github.ref_name }}.exe SHA256
          ```
          _(Compare that the result matches exactly with the official hash above)._
          
          ---
          _Generated automatically by GitHub Actions._
