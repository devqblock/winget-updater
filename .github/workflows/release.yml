name: Compilar y Publicar Release Automático

on:
  push:
    tags:
      - 'v*' # Se activa al subir etiquetas como v1.1.0, v2.0.0, etc.

permissions:
  contents: write # Permiso obligatorio para crear el release y subir archivos

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar el código fuente
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Ejecutar script de compilación y hash
      id: crypto
      env:
        TAG_VERSION: \${{ github.ref_name }}
      run: |
        python github_build.py

    - name: Crear Release y subir archivos
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/WingetUpdater-\${{ github.ref_name }}.exe
          dist/checksums.txt
        name: WingetUpdater \${{ github.ref_name }}
        body: |
          ## 🚀 WingetUpdater \${{ github.ref_name }}
          ¡Nueva versión publicada automáticamente!
          
          ### 🔒 Verificación de Integridad (SHA256)
          El hash SHA256 oficial para esta versión es:
          ```text
          \${{ steps.crypto.outputs.sha_hash }}
          ```
          
          Abre una terminal en tu carpeta de descargas y ejecuta el comando correspondiente para verificar que el archivo es auténtico:
          
          #### 💻 PowerShell
          ```powershell
          Get-FileHash .\WingetUpdater-\${{ github.ref_name }}.exe -Algorithm SHA256
          ```
          _(Compara que el resultado coincida exactamente con el hash oficial de arriba)._
          
          #### 📟 Símbolo del sistema (CMD)
          ```cmd
          certutil -hashfile WingetUpdater-\${{ github.ref_name }}.exe SHA256
          ```
          _(Compara que el resultado coincida exactamente con el hash oficial de arriba)._
          
          ---
          _Generado automáticamente mediante GitHub Actions._
