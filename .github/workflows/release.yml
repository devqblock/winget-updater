name: Compile and Publish Automatic Release

on:
  push:
    tags:
      - 'v*' # It is triggered when uploading tags such as v1.0.7, v1.1, etc.

permissions:
  contents: write # Required permission to create the release and upload files.

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile executable with PyInstaller
      run: |
        pyinstaller --clean --noconfirm --onefile --windowed --name WingetUpdater --icon icono.ico --add-data "icono.ico;." --manifest admin.manifest WingetUpdater.py

    - name: Generate SHA256 Hash (Python Universal)
      id: crypto
      run: |
        python -c "import hashlib, os; h = hashlib.sha256(open('dist/WingetUpdater_${{ github.ref_name }}.exe','rb').read()).hexdigest(); open('dist/checksums.txt','w').write(f'{h}  WingetUpdater_${{ github.ref_name }}.exe\n'); f = open(os.environ['GITHUB_OUTPUT'], 'a'); f.write(f'sha_hash={h}\n'); f.close()"

    - name: Create Release and upload files
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/WingetUpdater_${{ github.ref_name }}.exe
          dist/checksums.txt
        name: WingetUpdater ${{ github.ref_name }}
        body: |
          ## 🚀 WingetUpdater ${{ github.ref_name }}
          New version automatically published!
          
          ### 🔒 Integrity Verification (SHA256)
          You can verify that the executable has not been modified by comparing it with this hash or downloading the `checksums.txt` file:
          
          ```text
          ${{ steps.crypto.outputs.sha_hash }}
          ```
          Open a terminal in your Downloads folder and run the corresponding command to verify that the file is authentic:
          
          #### 💻 PowerShell
          ```powershell
          if ((Get-FileHash .\WingetUpdater_${{ github.ref_name }}.exe -Algorithm SHA256).Hash.ToLower() -eq "${{ steps.crypto.outputs.sha_hash }}") { Write-Host "✓ Correct hash. The file is safe." -ForegroundColor Green } else { Write-Host "✗ ERROR: The hash does not match. File may be modified or corrupt." -ForegroundColor Red }
          ```
          
          #### 📟 Command Prompt (CMD)
          ```cmd
          certutil -hashfile WingetUpdater_${{ github.ref_name }}.exe SHA256
          ```
          _(In CMD, you will need to visually verify that the output line matches the official hash above exactly)._
          
          ---
          _Generated automatically by GitHub Actions._
